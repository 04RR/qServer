# llama-swap v240 config — three MUTUALLY EXCLUSIVE models on one pair of GPUs
# (one dense+vision 27B, two MoE). One loads at a time; the others are evicted.
#
# SCHEMA NOTE (verified against config.example.yaml @ tag v240, not from memory):
#   `groups` is NOT top-level any more — it moved under routing.router.settings.groups,
#   and there are now two swap engines (group | matrix). Re-verify on any llama-swap upgrade.
#
# WHY ONE GROUP CONTAINING ALL: swap:true means only one member runs at a time; exclusive:true
# means loading a member unloads every other group. Every model in ONE swap:true group is the
# hard mutual-exclusion requirement — the 27B (Q6, dual-GPU) needs GPU0+GPU1, the 35B needs
# GPU0+GPU1, the 122B needs GPU0+GPU1+~15 GiB RAM. No two can coexist, so they must NEVER be in
# a swap:false (concurrent) group.
#
# WHY cmd POINTS AT THE RUN SCRIPTS: those scripts encode every hard-won flag (layer split, q8_0
# KV, mmproj, MTP). Duplicating them here would let the two drift apart. The scripts `exec` the
# binary, so the PID llama-swap tracks IS llama-server — SIGTERM reaches the real process instead
# of killing a wrapper and orphaning the server holding 20+ GB of VRAM.

# 900s: the 122B is 48 GiB across VRAM+RAM. Warm (page cache) it boots in ~90s; COLD off disk it
# is far slower. 300 would time out a cold 122B load and look like a failure.
healthCheckTimeout: 900
logLevel: info
startPort: 10001
unloadTimeout: 30           # graceful SIGTERM window before force-kill (the 122B also has a
                            # ~15 GiB RAM slice to release, not just VRAM)

models:
  # PRIMARY DENSE + NATIVE VISION. Qwen3.8-27B (qwen3_5 arch — SAME family as the 35B/122B, weights
  # differ). Replaces the ENTIRE 3.6-27B dense line (old Q4 fast + Q6 quality entries) with ONE
  # multimodal server: Q6_K weights (22.9 GiB) span BOTH GPUs via --split-mode layer + --tensor-split
  # (in run-38-27b.sh), mmproj-F16 loaded for image/video, MTP embedded and verified to coexist with
  # vision (gates38.sh: 17/0). Mutually exclusive with the 35B/122B automatically via the single
  # swap:true "gpu-exclusive" group. Legacy aliases (qwen36 / qwen36-q6 / qwen36-text) are CARRIED
  # onto it so existing clients keep working — they now land on 3.8, which supersedes the retired 3.6.
  "qwen-38-27b":
    name: "Qwen3.8-27B dense + vision (4090 + 5060 Ti)"
    description: "Dense qwen3_5 27B Q6_K, native VLM (mmproj-F16), --split-mode layer -ts 3,1 across both GPUs, MTP n=4, 131072 ctx, q8_0 KV."
    cmd: /home/rohit/ai/qwen36/run-38-27b.sh
    proxy: http://127.0.0.1:8080      # script defaults --port 8080 (the primary-dense slot)
    checkEndpoint: /health
    ttl: 0                            # never auto-unload; swap only on explicit demand
    aliases:
      - "qwen38"
      - "qwen38-27b"
      - "qwen36"                       # legacy: existing clients / regress.sh send this -> now 3.8
      - "qwen36-q6"                    # legacy Q6 alias -> now 3.8 (Q6_K)
      - "qwen36-text"

  "qwen-35b":
    name: "Qwen3.6-35B-A3B MoE (4090 + 5060 Ti)"
    description: "MoE 35B, min-spill expert offload (blk.28-33 -> CUDA1), MTP n=3, 131072 ctx."
    cmd: /home/rohit/ai/qwen36/run-text-35b.sh
    proxy: http://127.0.0.1:8082
    checkEndpoint: /health
    ttl: 0
    aliases:
      - "qwen36-35b"                  # what gates35.sh / bench35.py already send

  "qwen-122b":
    name: "Qwen3.5-122B-A10B MoE (4090 + 5060 Ti + system RAM)"
    description: "MoE 122B UD-IQ3_S, TRI-TIER: experts on GPU0 + GPU1 + ~15 GiB in RAM. MTP n=6, 131072 ctx, ~40 t/s."
    cmd: /home/rohit/ai/qwen36/run-text-122b.sh
    proxy: http://127.0.0.1:8084
    checkEndpoint: /health
    ttl: 0
    # This model holds a ~15 GiB RAM slice on top of both GPUs. Eviction must release the RAM too,
    # not just VRAM -- that is enforced by process lifetime (the slice dies with the process), and
    # it is verified explicitly in the swap test rather than assumed. 30s to shut down cleanly.
    unloadTimeout: 30
    aliases:
      - "qwen35-122b"                 # what gates122.sh / the probes already send

routing:
  router:
    use: group
    settings:
      groups:
        "gpu-exclusive":
          swap: true        # only one member runs at a time  <-- the correctness requirement
          exclusive: true   # loading a member unloads every other group
          # ALL THREE are mutually exclusive. The 27B (Q6) spans GPU0+GPU1; the 35B needs GPU0+GPU1;
          # the 122B needs GPU0+GPU1+~15 GiB RAM. No two can coexist, so they must never be split
          # into a swap:false (concurrent) group.
          members:
            - qwen-38-27b
            - qwen-35b
            - qwen-122b
